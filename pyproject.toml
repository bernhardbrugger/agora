[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-debate"
version = "0.4.0"
description = "Multi-agent AI debates in your terminal - supports Claude, GPT, Gemini, and Grok"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bernhard Brugger", email = "bernhardb0100@gmail.com" }]
keywords = ["debate", "multi-agent", "llm", "claude", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.45.0"]
gemini = ["google-genai>=1.0"]
grok = ["openai>=1.0.0"]
mcp = ["mcp>=1.2; python_version>='3.10'"]
all = ["openai>=1.45.0", "google-genai>=1.0"]

[project.scripts]
agora = "agora.cli:main"

[project.urls]
Homepage = "https://github.com/bernhardbrugger/agora"
Issues = "https://github.com/bernhardbrugger/agora/issues"
Changelog = "https://github.com/bernhardbrugger/agora/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["agora*"]

[tool.setuptools.package-data]
agora = ["personas/*.yaml"]
"agora.formats" = ["*.yaml"]
